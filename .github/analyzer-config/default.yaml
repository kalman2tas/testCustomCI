engines:
  - name: pmd
    enabled: true
    options:
      language: apex

  - name: eslint
    enabled: true
    options:
      language: javascript

rules:
  - engine: pmd
    rules:
      - apex/no-global-sosl
      - apex/no-hardcoded-ids

  - engine: eslint
    rules:
      - eslint/no-unused-vars
      - eslint/no-console
